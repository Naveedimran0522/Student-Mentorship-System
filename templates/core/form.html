{% extends 'base.html' %}{% block heading %}{{ page_title }}{% endblock %}{% block content %}<div class="panel form-panel"><h2>{{ page_title }}</h2><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div><button class="btn btn-primary mt-4">Save</button><a class="btn btn-light mt-4" href="javascript:history.back()">Cancel</a></form></div>{% endblock %}
